# Codecov configuration for the upload in .github/workflows/coverage.yml.
# Reference: https://docs.codecov.com/docs/codecov-yaml

codecov:
  # coverage.yml is the only uploader, so its report should neither be withheld
  # because another workflow's check failed nor wait for those checks to finish.
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

# No path fixes are needed. c8 names every file relative to the repository root
# (the TypeScript sources rather than the untracked .js next to them, since
# scripts/coverage.sh compiles lib/ with inline source maps), and cargo llvm-cov
# by its absolute path in the checkout, which Codecov's default path fixing maps
# onto the repository.

# Both reports go up in one upload, so there are no flags. The components split
# the figure into the driver's two layers by path instead: the Rust addon is
# under a tenth of the lines, so a change in it would barely move the project
# figure on its own.
component_management:
  individual_components:
    - component_id: js
      name: JavaScript API
      paths:
        - main.js
        - lib/**
    - component_id: rust
      name: Rust addon
      paths:
        - src/**

coverage:
  status:
    # Informational: report the delta, never fail a pull request on it. The
    # integration suites run against a live ScyllaDB cluster, so which lines
    # they reach depends on cluster timing as well as on the diff.
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true
