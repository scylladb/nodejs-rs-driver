# Codecov configuration for the coverage lane in .github/workflows/coverage.yml,
# which uploads the two lcov reports scripts/coverage.sh writes, one per layer
# of the driver: coverage/js/lcov.info (c8) and coverage/rust/lcov.info
# (cargo llvm-cov).
# Reference: https://docs.codecov.com/docs/codecov-yaml

codecov:
  # The coverage lane is a workflow of its own, independent of the rest of CI
  # and the only thing that uploads, so its report stands on its own. Codecov's
  # defaults tie it to the other checks in two separate ways, and both are
  # turned off: require_ci_to_pass withholds the report when any other check
  # failed, and notify.wait_for_ci holds it back while any other check (the
  # unit, integration, examples and docs workflows' jobs) is still running.
  require_ci_to_pass: false
  notify:
    wait_for_ci: false

# There are no `fixes` or `ignore` entries: c8 names every file relative to the
# repository root -- main.js, lib/client.ts; the TypeScript sources rather than
# the untracked .js next to them, since coverage.sh compiles lib/ with inline
# source maps -- and cargo llvm-cov names every file by its absolute path in the
# coverage job's checkout. Codecov's default path fixing maps each of those onto
# the right file in the repository. The upload job in coverage.yml checks that
# both reports keep that shape and still cover their layers, since the
# components below are computed from whatever files the upload names.
#
# There are no flags either. Both reports go up in one upload, so every commit
# that has a report has both halves of it, and carryforward -- which only fills
# in the flags missing from a commit that did upload -- would have nothing to
# do. The per-layer split comes from the components below instead, which are
# computed from that one upload by path.

component_management:
  individual_components:
    - component_id: js
      name: JavaScript API
      paths:
        - main.js
        - lib/**
    - component_id: rust
      name: Rust addon
      paths:
        - src/**

coverage:
  status:
    # informational: report the delta, never fail a pull request on it. A
    # failed run uploads nothing (see the upload job in coverage.yml), so a
    # partial report is not the concern here. What remains is that the
    # integration suites run against a live ScyllaDB cluster, and which lines
    # they reach -- retries, reconnects, topology and schema events, timeouts --
    # depends on cluster timing as much as on the diff, so two clean runs of one
    # commit can land a little apart. Tests that skip on a ScyllaDB version
    # without the feature they need also move the number whenever
    # scylla_version.env is bumped. This can be revisited, and informational
    # turned off, once the run-to-run spread has a track record of staying
    # inside the threshold.
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true
