[package]
edition = "2024"
name = "scylladb-javascript-driver"
version = "0.7.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1"

napi = { version = "3.6.0", default-features = false, features = ["napi4", "napi6"] }
napi-derive = "3.4.0"
# Keep these versions aligned: execute_unstable accepts scylla-cql-core's SerializedValues.
# The interop APIs for pre-serialized values are gated by other bindings' features
# until a Node-specific gate is available:
# - execute_unstable by unstable-python-rs
# - ClusterState::compute_token_preserialized by unstable-csharp-rs
scylla = { version = "=1.9.0", features = ["num-bigint-03", "openssl-010", "unstable-nodejs-rs", "unstable-python-rs", "unstable-csharp-rs", "unstable-client-routes"] }
scylla-cql-core = "=1.9.0"
tokio = { version = "1.34", features = ["full"] }
futures = "0.3"
uuid = "1"
regex = "1.11.1"
thiserror = "2.0.12"
num-bigint = "0.4.6"
openssl = "0.10.70"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

scylla-proxy = { version = "0.0.6", optional = true }

[features]
# Enables proxy helpers used by test helpers.
tests = ["scylla-proxy"]

[lints.rust]
unsafe-op-in-unsafe-fn = "warn"

[build-dependencies]
napi-build = "2.1.5"

[profile.release]
lto = true
panic = "abort"

[profile.dev]
panic = "abort"
