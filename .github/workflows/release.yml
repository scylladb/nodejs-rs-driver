name: Release package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create and publish the release (uncheck for a complete dry run)"
        type: boolean
        default: true

env:
  DEBUG: napi:*
  PEDANTIC: true

permissions:
  contents: read

concurrency:
  group: release-package
  queue: max

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Capture release commit
        env:
          RELEASE_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be dispatched from main, not $DISPATCH_REF."
            exit 1
          fi
          echo "Release commit: $RELEASE_SHA"
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify checked-out commit
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Validate release versions
        id: version
        run: bash .github/scripts/check-release-order.sh newer
      - name: Check for a conflicting release tag
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          remote_tag=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG") || {
            echo "::error::Could not check the remote release tag."
            exit 1
          }
          if [[ -n "$remote_tag" ]]; then
            remote_sha=${remote_tag%%[[:space:]]*}
            if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
              echo "::error::Remote tag $RELEASE_TAG points to $remote_sha, not $RELEASE_SHA."
              exit 1
            fi
            echo "Remote tag $RELEASE_TAG already points to the release commit."
          fi
      - name: Check for open release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-release-blockers.sh

  extended-ci:
    needs: prepare
    uses: ./.github/workflows/extended-ci.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  unit-tests:
    needs: prepare
    uses: ./.github/workflows/unit-tests.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  typescript-tests:
    needs: prepare
    uses: ./.github/workflows/typescript-tests.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  release-docs:
    needs: prepare
    uses: ./.github/workflows/release-docs.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu
            files: |
              index.linux-x64-gnu.node
              index.d.ts
              index.js
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build: npm run build -- --target aarch64-unknown-linux-gnu
            files: |
              index.linux-arm64-gnu.node
    name: Build for release - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/common/setup
        with:
          node-version: 24
          host: ${{ matrix.settings.host }}
          target: ${{ matrix.settings.target }}
          revision: ${{ github.sha }}
      - name: Install libraries for linking
        run: sudo apt-get install -y libssl-dev
      - name: Build ${{ matrix.settings.target }}
        run: ${{ matrix.settings.build }}
      - name: Upload artifact - ${{ matrix.settings.target }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ matrix.settings.files }}
          if-no-files-found: error

  # Integration tests run in Extended CI. These jobs verify the built packages
  # by running the examples on both release architectures.
  test-x86_64-unknown-linux-gnu-examples:
    needs:
      - prepare
      - build
    name: Test built package - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bindings-x86_64-unknown-linux-gnu
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build:ts
      - name: Setup 3-node Scylla cluster
        run: |
          sudo sh -c "echo 2097152 >> /proc/sys/fs/aio-max-nr"
          docker compose -f .github/docker-compose.yml up -d --wait
      - name: Install examples dependencies
        run: npm --prefix examples ci
      - name: Run all examples
        run: SCYLLA_URI=172.42.0.2:9042 npm run examples
      - name: Stop the cluster
        if: ${{ always() }}
        run: docker compose -f .github/docker-compose.yml stop
      - name: Print the cluster logs
        if: ${{ always() }}
        run: docker compose -f .github/docker-compose.yml logs
      - name: Remove cluster
        if: ${{ always() }}
        run: docker compose -f .github/docker-compose.yml down

  test-aarch64-unknown-linux-gnu-examples:
    needs:
      - prepare
      - build
    name: Test built package - aarch64-unknown-linux-gnu - node@24
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: Build TypeScript
        run: npm run build:ts
      - name: Setup 3-node Scylla cluster
        run: |
          sudo sh -c "echo 2097152 >> /proc/sys/fs/aio-max-nr"
          docker compose -f .github/docker-compose.yml up -d --wait
      - name: Install examples dependencies
        run: npm --prefix examples ci
      - name: Run all examples
        run: SCYLLA_URI=172.42.0.2:9042 npm run examples
      - name: Stop the cluster
        if: ${{ always() }}
        run: docker compose -f .github/docker-compose.yml stop
      - name: Print the cluster logs
        if: ${{ always() }}
        run: docker compose -f .github/docker-compose.yml logs
      - name: Remove cluster
        if: ${{ always() }}
        run: docker compose -f .github/docker-compose.yml down

  package-dry-run:
    needs:
      - prepare
      - build
    name: Assemble and dry-run npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - name: Create npm directories
        run: npm run create-npm-dirs
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble packages
        run: |
          cp ./artifacts/index.js ./artifacts/index.d.ts .
          npm run build:ts
          npm run artifacts
          test -f npm/linux-x64-gnu/index.linux-x64-gnu.node
          test -f npm/linux-arm64-gnu/index.linux-arm64-gnu.node
          test -f index.js
          test -f index.d.ts
          rm ./*.node
          npx napi prepublish -t npm --no-gh-release --skip-optional-publish
      - name: List packages
        run: ls -R ./npm
      - name: Check that npm versions are unused
        run: |
          node - <<'NODE'
          async function main() {
            const packageFiles = [
              'npm/linux-x64-gnu/package.json',
              'npm/linux-arm64-gnu/package.json',
              'package.json',
            ];
            for (const packageFile of packageFiles) {
              const { name, version } = require(`./${packageFile}`);
              const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`;
              const response = await fetch(url);
              if (response.status === 200) {
                console.error(`::error::${name}@${version} is already published.`);
                process.exitCode = 1;
              } else if (response.status !== 404) {
                throw new Error(`Could not check ${name}@${version}: HTTP ${response.status}`);
              }
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Dry-run publish
        run: |
          (cd npm/linux-x64-gnu && npm publish --dry-run --access public)
          (cd npm/linux-arm64-gnu && npm publish --dry-run --access public)
          npm publish --dry-run --access public --ignore-scripts

  create-tag:
    if: inputs.publish
    needs:
      - prepare
      - extended-ci
      - unit-tests
      - typescript-tests
      - release-docs
      - build
      - test-x86_64-unknown-linux-gnu-examples
      - test-aarch64-unknown-linux-gnu-examples
      - package-dry-run
    name: Create release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Recheck release order
        run: bash .github/scripts/check-release-order.sh not-older
      - name: Recheck for open release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-release-blockers.sh
      - name: Recheck and create tag
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          remote_tag=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG") || {
            echo "::error::Could not recheck the remote release tag."
            exit 1
          }
          if [[ -n "$remote_tag" ]]; then
            remote_sha=${remote_tag%%[[:space:]]*}
            if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
              echo "::error::Remote tag $RELEASE_TAG points to $remote_sha, not $RELEASE_SHA."
              exit 1
            fi
            echo "Remote tag $RELEASE_TAG already points to the release commit."
          else
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi
          remote_sha=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | cut -f1)
          if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Remote tag $RELEASE_TAG points to $remote_sha, not $RELEASE_SHA."
            exit 1
          fi

  publish:
    needs:
      - prepare
      - build
      - create-tag
    name: Publish npm packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Create npm directories
        run: npm run create-npm-dirs
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Assemble packages
        run: |
          cp ./artifacts/index.js ./artifacts/index.d.ts .
          npm run build:ts
          npm run artifacts
          test -f npm/linux-x64-gnu/index.linux-x64-gnu.node
          test -f npm/linux-arm64-gnu/index.linux-arm64-gnu.node
          test -f index.js
          test -f index.d.ts
          rm ./*.node
          npx napi prepublish -t npm --no-gh-release --skip-optional-publish
      - name: Recheck for open release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-release-blockers.sh
      - name: Recheck release order
        run: bash .github/scripts/check-release-order.sh not-older
      - name: Publish
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          npm config set provenance true
          get_published_integrity() {
            local package_spec=$1
            local view_output

            if view_output=$(npm view "$package_spec" dist.integrity --json); then
              node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$view_output"
              return $?
            fi
            if [[ "$view_output" == *'"code": "E404"'* ]]; then
              return 4
            fi
            echo "::error::Could not query $package_spec in the npm registry." >&2
            echo "$view_output" >&2
            return 1
          }

          publish_package() {
            package_dir=$1
            package_name=$(node -p "require('./$package_dir/package.json').name")
            package_version=$(node -p "require('./$package_dir/package.json').version")
            package_spec="$package_name@$package_version"
            local_integrity=$(
              (cd "$package_dir" && npm pack --dry-run --json --ignore-scripts) |
                node -e 'const fs = require("fs"); const result = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(result[0].integrity)'
            )
            published_integrity=
            if published_integrity=$(get_published_integrity "$package_spec"); then
              :
            else
              lookup_status=$?
              if [[ "$lookup_status" != "4" ]]; then
                exit "$lookup_status"
              fi
            fi

            if [[ -n "$published_integrity" ]]; then
              if [[ "$RUN_ATTEMPT" == "1" ]]; then
                echo "::error::$package_spec was already published before this release attempt."
                exit 1
              fi
              if [[ "$published_integrity" != "$local_integrity" ]]; then
                echo "::error::$package_spec exists with different package integrity."
                exit 1
              fi
              echo "$package_spec was already published by an earlier attempt; skipping."
              return
            fi

            (cd "$package_dir" && npm publish --provenance --access public --ignore-scripts)

            for attempt in 1 2 3 4 5; do
              published_integrity=
              if published_integrity=$(get_published_integrity "$package_spec"); then
                :
              else
                lookup_status=$?
                if [[ "$lookup_status" != "4" ]]; then
                  exit "$lookup_status"
                fi
              fi
              if [[ "$published_integrity" == "$local_integrity" ]]; then
                return
              fi
              if [[ -n "$published_integrity" ]]; then
                echo "::error::$package_spec was published with unexpected package integrity."
                exit 1
              fi
              if [[ "$attempt" -lt 5 ]]; then
                sleep 5
              fi
            done
            echo "::error::Could not verify $package_spec after publication."
            exit 1
          }

          publish_package npm/linux-x64-gnu
          publish_package npm/linux-arm64-gnu
          publish_package .

  verify-published-package:
    needs:
      - prepare
      - publish
    name: Verify published package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
      - uses: ./.github/common/example
        with:
          build-command: |
            cd examples
            VERSION=${{ needs.prepare.outputs.version }}
            # The examples lockfile links the driver from the repository root for local development.
            # Passing an explicit package spec forces npm to replace that link with the published package.
            (for i in 1 2 3 4 5; do
              if npm install --prefer-online --save-exact "@scylladb/driver@$VERSION"; then
                if [ -L node_modules/@scylladb/driver ]; then
                  echo "::error::npm kept the local @scylladb/driver link instead of installing the published package."
                  exit 1
                fi
                RESOLVED=$(node -p 'require("./package-lock.json").packages["node_modules/@scylladb/driver"]?.resolved || ""') || RESOLVED=
                if [[ "$RESOLVED" != https://registry.npmjs.org/* ]]; then
                  echo "::error::@scylladb/driver did not resolve from the public npm registry: ${RESOLVED:-missing}"
                  exit 1
                fi
                node -e 'require("@scylladb/driver")' && exit 0
              fi
              if [ "$i" -lt 5 ]; then
                echo "Attempt $i failed, retrying in 15s (waiting for npm propagation)..."
                sleep 15
              fi
            done
            echo "::error::Giving up. Couldn't download or load newly released package."
            exit 1)

  create-github-release:
    needs:
      - prepare
      - build
      - verify-published-package
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: bindings-*
          merge-multiple: true
      - name: Recheck published release versions
        run: bash .github/scripts/check-release-order.sh current
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          remote_sha=$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | cut -f1)
          if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Remote tag $RELEASE_TAG points to $remote_sha, not $RELEASE_SHA."
            exit 1
          fi
          if release_is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$release_is_draft" == "true" ]]; then
              gh release upload "$RELEASE_TAG" artifacts/*.node --clobber
              gh release edit "$RELEASE_TAG" \
                --draft=false \
                --prerelease=false \
                --latest
            else
              echo "$RELEASE_TAG is already published."
            fi
          else
            gh release create "$RELEASE_TAG" artifacts/*.node \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --latest
          fi

  publish-docs:
    needs:
      - prepare
      - create-github-release
    uses: ./.github/workflows/docs-pages.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: read
      pages: write
      id-token: write
