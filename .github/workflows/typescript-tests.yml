name: Run Typescript tests
env:
  DEBUG: napi:*
"on":
  push:
    branches:
      - main
      - "branch-**"
  pull_request:
    branches:
      - '**'
  workflow_call:
    inputs:
      ref:
        description: "Full commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: typescript-tests-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.ref == '' }}

jobs:
  build-and-run-tests:
    strategy:
      fail-fast: false
    name: Build and run typescript tests - node@20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/common/setup
        with:
          host: ubuntu-latest
          target: x86_64-unknown-linux-gnu
          revision: ${{ inputs.ref || github.sha }}
      - name: Build
        run: npm run build
        shell: bash
      - name: Compile TypeScript
        run: npm run typescript-tests
        shell: bash
